<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="AlignSynch — two people answer the same questions; the distance between their answers is the Gap.">
  <title>AlignSynch</title>
  <!-- Brand palette only: #156898 primary, #8dc63f accent, #ffffff ground, #363d49 text -->
  <rect width="1280" height="320" fill="#ffffff"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Wordmark glyph: two answers of different height, the green bracket measuring the gap -->
    <line x1="78" y1="108" x2="116" y2="108" stroke="#363d49" stroke-width="2" stroke-linecap="round"/>
    <rect x="80" y="76" width="9" height="28" rx="2" fill="#156898"/>
    <rect x="105" y="86" width="9" height="18" rx="2" fill="#156898"/>
    <path d="M 84.5 76 L 84.5 86 L 105 86" fill="none" stroke="#8dc63f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wordmark -->
    <text x="134" y="118" font-size="72" font-weight="700" fill="#156898">AlignSynch</text>
    <!-- One line of honest copy, set on two lines for legibility -->
    <text x="134" y="168" font-size="28" fill="#363d49">Two people answer the same questions.</text>
    <text x="134" y="212" font-size="28" fill="#363d49">The distance between their answers is <tspan fill="#156898" font-weight="600">the Gap</tspan>.</text>
    <!-- The Gap as geometry: two answer bars on a baseline, the accent bracket measuring the distance between their tops -->
    <line x1="830" y1="212" x2="1210" y2="212" stroke="#363d49" stroke-width="2" stroke-linecap="round"/>
    <rect x="860" y="132" width="40" height="80" rx="6" fill="#156898"/>
    <rect x="1120" y="167" width="40" height="45" rx="6" fill="#156898"/>
    <path d="M 880 132 L 880 167 L 1120 167" fill="none" stroke="#8dc63f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1000" y="196" font-size="24" text-anchor="middle" fill="#363d49">the Gap</text>
  </g>
</svg>
