<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlignSynch — the relationship lifecycle, ten stages</title>
<style>
  /* Geometry measured from docs/specs/spec-ux-repo-patterns/ (see docs/specs/ux-reference-patterns.md):
     content 1126px left-justified, 12-col grid @24px gutter, cards 1px border radius 6 padding 24
     with no shadow, labels 12px muted above 40px controls, progress as a cell rail (never numbered
     circles), one accent primary action per view. Brand colour stays the app's token: #37474f. */
  :root{
    --action:#37474f; --action-ink:#fff; --action-soft:#eef1f3;
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --line-strong:#d1d5db;
    --bg:#f9fafb; --panel:#fff; --ok:#15803d; --ok-soft:#f0fdf4; --warn:#b45309; --warn-soft:#fffbeb;
    --paypal:#003087;
    --radius:6px; --pad:24px; --gap:24px; --gutter:24px;
    --stage-max:1126px; --rail:241px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; color:var(--ink); background:var(--bg)}
  a{color:var(--action)}
  h1,h2,h3,h4{margin:0; line-height:1.25; font-weight:600}
  h1{font-size:1.875rem} h2{font-size:1.125rem} h3{font-size:1rem}
  p{margin:.35rem 0}
  small,.muted{color:var(--muted); font-size:.875rem}
  .meta{color:var(--muted); font-size:.75rem}

  /* ---- shell ---- */
  .shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
  .rail{background:var(--panel); border-right:1px solid var(--line); padding:18px 14px; position:sticky; top:0; height:100vh; overflow:auto}
  .brand{display:flex; gap:9px; align-items:center; margin-bottom:20px}
  .mark{width:26px; height:26px; border-radius:6px; background:var(--action); display:grid; place-items:center; color:#fff; font-size:11px; font-weight:700}
  .brand b{font-size:.9rem; display:block}
  .brand span{font-size:.72rem; color:var(--muted)}
  .nav-group{margin:0 0 14px}
  .nav-group>label{display:block; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 8px 5px}
  .nav a{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:0 10px; min-height:40px; border-radius:6px; font-size:.875rem; color:var(--ink); text-decoration:none}
  .nav a[aria-current="page"]{background:var(--action); color:var(--action-ink); font-weight:600}
  .nav a:hover{background:#f3f4f6}
  .nav a[aria-current="page"]:hover{background:var(--action)}
  .nav .count{font-size:.72rem; color:var(--muted)}
  .nav a[aria-current="page"] .count{color:var(--action-ink); opacity:.8}

  main{padding:22px 40px 72px 24px; min-width:0}
  .column{width:100%; max-width:var(--stage-max)}

  /* ---- progress: CELL RAIL (reference §4b) ---- */
  .steps{display:flex; align-items:stretch; margin:0 0 20px; padding:0; list-style:none;
         border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel)}
  .steps li{flex:1 1 0; min-width:0; display:flex}
  .steps button{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center;
                width:100%; min-height:39px; padding:0 6px; font-size:.75rem; color:var(--muted);
                background:var(--panel); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .steps li+li button{box-shadow:inset 1px 0 0 var(--line)}
  .steps button:hover{background:#f6f7f8}
  .steps li[data-state="now"] button{background:var(--bg); color:var(--ink); font-weight:600; font-size:.8rem}
  .steps li[data-state="done"] button{color:var(--ink)}
  .steps button:focus-visible{outline:2px solid var(--action); outline-offset:-2px}

  /* ---- surfaces ---- */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius)}
  .card>.head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:var(--pad); border-bottom:1px solid var(--line)}
  .card>.body{padding:var(--pad)}
  .card>.foot{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px var(--pad);
              border-top:1px solid var(--line); background:#fcfcfd; border-radius:0 0 var(--radius) var(--radius)}
  .chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line-strong); background:#fff;
        border-radius:999px; padding:2px 9px; font-size:.75rem; font-weight:500; color:#374151}
  .chip.ok{border-color:#bbf7d0; background:var(--ok-soft); color:var(--ok)}
  .chip.warn{border-color:#fde68a; background:var(--warn-soft); color:var(--warn)}
  .chip.gap{border-color:#fecaca; background:#fef2f2; color:#b91c1c}
  .stack{display:grid; gap:var(--gap)}
  .tight{display:grid; gap:12px}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  .between{display:flex; justify-content:space-between; align-items:center; gap:12px}
  .grid12{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:var(--gutter)}
  .span3{grid-column:span 3} .span4{grid-column:span 4} .span5{grid-column:span 5}
  .span6{grid-column:span 6} .span7{grid-column:span 7} .span8{grid-column:span 8} .span12{grid-column:span 12}
  label.field{display:block}
  label.field>span{display:block; font-size:.75rem; font-weight:500; color:var(--muted); margin-bottom:8px}
  label.field>em{display:block; font-size:.78rem; color:var(--muted); font-style:normal; margin-top:6px}
  input[type=text],input[type=email],input[type=password],textarea,select{
    width:100%; min-height:40px; padding:9px 10px; border:1px solid var(--line-strong);
    border-radius:8px; font:inherit; background:#fff; color:var(--ink)}
  textarea{min-height:76px; resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--action); outline-offset:1px; border-color:var(--action)}
  .btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
       min-height:40px; padding:0 16px; border-radius:6px; font-size:.875rem; font-weight:600; text-align:center}
  .btn:focus-visible{outline:2px solid var(--action); outline-offset:2px}
  .btn.primary{background:var(--action); color:var(--action-ink)}
  .btn.secondary{background:#fff; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line-strong)}
  .btn.ghost{color:var(--action); padding:0 4px; min-height:32px}
  .btn.paypal{background:var(--paypal); color:#fff}
  .btn[disabled]{opacity:.5; cursor:not-allowed}
  .choice{display:flex; gap:12px; align-items:flex-start; padding:16px; border:1px solid var(--line-strong);
          border-radius:var(--radius); cursor:pointer; background:#fff}
  .choice[aria-checked="true"]{border-color:var(--action); box-shadow:inset 0 0 0 1px var(--action); background:#fbfcfc}
  .choice .dot{width:16px; height:16px; border-radius:50%; border:1px solid var(--line-strong); margin-top:3px; flex:0 0 auto; display:grid; place-items:center}
  .choice[aria-checked="true"] .dot{border-color:var(--action)}
  .choice[aria-checked="true"] .dot::after{content:""; width:8px; height:8px; border-radius:50%; background:var(--action)}
  .choice b{display:block; font-size:.9rem}
  .tpl{display:flex; flex-direction:column; gap:10px; padding:var(--pad); border:1px solid var(--line);
       border-radius:var(--radius); background:#fff; cursor:pointer; height:100%}
  .tpl[aria-checked="true"]{border-color:var(--action); box-shadow:inset 0 0 0 1px var(--action)}
  .tpl h3{font-size:1rem}
  .tpl .thumb{height:104px; border-radius:var(--radius); border:1px solid var(--line); background:var(--bg);
              display:grid; place-items:center; color:var(--muted); font-size:.75rem}
  .aspect{border:1px solid var(--line); border-radius:var(--radius); padding:16px; background:#fff}
  .aspect header{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
  .two-up{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .meter{height:6px; border-radius:999px; background:#eef0f2; overflow:hidden}
  .meter>i{display:block; height:100%; background:var(--action)}
  .mini{font-size:.78rem; color:var(--muted)}
  .note{border-left:3px solid var(--line-strong); padding:2px 0 2px 10px; color:var(--muted); font-size:.84rem}
  .banner{display:flex; gap:10px; align-items:flex-start; padding:14px 16px; border-radius:var(--radius);
          border:1px solid #bbf7d0; background:var(--ok-soft); font-size:.875rem}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:.875rem}
  .kv dt{color:var(--muted)} .kv dd{margin:0; text-align:right; font-weight:600}
  .stage-foot{display:flex; justify-content:space-between; gap:12px; margin-top:var(--gap); padding-top:16px; border-top:1px solid var(--line)}
  .tabs{display:flex; gap:0; border-bottom:1px solid var(--line); margin-bottom:var(--gap)}
  .tabs button{all:unset; cursor:pointer; padding:10px 16px; font-size:.875rem; color:var(--muted); border-bottom:2px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--ink); font-weight:600; border-bottom-color:var(--action)}
  .hidden{display:none !important}

  /* ---- copy editor ---- */
  #editor{position:fixed; right:18px; bottom:18px; z-index:40; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
          background:var(--panel); border:1px solid var(--line-strong); border-radius:999px; padding:8px 12px;
          box-shadow:0 6px 20px rgb(16 24 40 / .12); font-size:.8rem}
  #editor .dot-live{width:8px; height:8px; border-radius:50%; background:var(--ok)}
  body[data-editing="on"] [data-copy]{outline:1px dashed #9ca3af; outline-offset:2px; border-radius:3px}
  body[data-editing="on"] [data-copy]:focus{outline:2px solid var(--action); background:#fffdf5}
  #toast{position:fixed; left:22px; bottom:18px; z-index:41; background:var(--ink); color:#fff; padding:8px 12px;
         border-radius:6px; font-size:.8rem; opacity:0; transform:translateY(6px); transition:.18s; max-width:60ch}
  #toast.show{opacity:1; transform:none}

  @media (max-width:1024px){ :root{--stage-max:100%} .span4,.span5,.span7,.span8{grid-column:span 6} }
  @media (max-width:860px){
    .shell{grid-template-columns:1fr}
    .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); padding:12px 14px}
    .rail .nav,.rail .brand span{display:none}
    main{padding:16px 16px 84px}
    .grid12,.two-up{grid-template-columns:1fr}
    .span3,.span4,.span5,.span6,.span7,.span8,.span12{grid-column:auto}
    .steps button{font-size:0; min-height:34px; padding:0}
    .steps button::after{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.45}
    .steps li[data-state="now"] button{font-size:.75rem; padding:0 8px}
    .steps li[data-state="now"] button::after{display:none}
    .stage-foot{flex-direction:column-reverse; align-items:stretch}
    .stage-foot .btn{width:100%}
    #editor{right:10px; left:10px; bottom:10px; justify-content:center}
  }
</style>
</head>

           + '<span class="muted" data-copy="'+k+'">'+esc(c(k))+'</span></div>').join("")
       + '</div><div class="foot"><button class="btn secondary" data-copy="s9.resend">'+esc(c("s9.resend"))+'</button>'
       + '<button class="btn ghost" data-copy="s9.copy">'+esc(c("s9.copy"))+'</button></div></div></div>'
     + '<aside class="span5"><div class="card"><div class="head"><h2 data-copy="s9.status">'+esc(c("s9.status"))+'</h2></div>'
       + '<div class="body"><p class="mini" data-copy="s9.sentTo">'+esc(c("s9.sentTo"))+'</p>'
       + '<button class="btn primary" data-goto="9" data-copy="s9.open" style="width:100%;margin-top:12px">'+esc(c("s9.open"))+'</button></div></div></aside>'
   + '</div>'
   + '<div class="stage-foot"><button class="btn secondary" data-goto="7" data-copy="s9.back">'+esc(c("s9.back"))+'</button>'
     + '<button class="btn primary" data-goto="9" data-copy="s9.next">'+esc(c("s9.next"))+'</button></div>'
  + '</div>';
}

/* ---------- 10: alignment ---------- */
function s10Align(){
  const total = state.aspects.reduce((n,a,i)=> n + Math.abs((SCORES[i]||{you:3,them:3}).you - (SCORES[i]||{you:3,them:3}).them), 0);
  return '<div class="stack">'
   + '<div><h1 data-copy="s10.heading">'+esc(c("s10.heading"))+'</h1><p class="muted" data-copy="s10.body">'+esc(c("s10.body"))+'</p></div>'
   + '<div class="card"><div class="head"><div><h2 data-copy="s10.gapHeading">'+esc(c("s10.gapHeading"))+'</h2>'
     + '<span class="muted" data-copy="s10.gapSubline">'+esc(c("s10.gapSubline"))+'</span></div>'
     + '<span class="chip ok" data-copy="s10.sealed">'+esc(c("s10.sealed"))+'</span></div>'
     + '<div class="body stack">'
       + state.aspects.map((a,i)=>{ const s = SCORES[i]||{you:3,them:3}; const gap = Math.abs(s.you-s.them);
           return '<div class="aspect"><header><b data-copy="'+a.key+'">'+esc(c(a.key))+'</b>'
             + '<span class="chip'+(gap>=2?" gap":"")+'"><span data-copy="'+(gap>=2?"s10.verdictGap":"s10.verdict")+'">'
             + esc(c(gap>=2?"s10.verdictGap":"s10.verdict"))+'</span> · '+gap+'</span></header>'
             + '<div class="two-up"><div><span class="mini" data-copy="s10.you">'+esc(c("s10.you"))+'</span>'
               + '<div class="meter"><i style="width:'+(s.you/5*100)+'%"></i></div></div>'
               + '<div><span class="mini" data-copy="s10.them">'+esc(c("s10.them"))+'</span>'
               + '<div class="meter"><i style="width:'+(s.them/5*100)+'%;background:#94a3b8"></i></div></div></div></div>';
         }).join("")
     + '</div>'
     + '<div class="foot"><span class="mini"><span data-copy="s10.total">'+esc(c("s10.total"))+'</span> <b>'+total+'</b></span>'
       + '<span class="chip">'+state.aspects.length+' Aspects</span></div></div>'
   + '<div class="card"><div class="head"><h2 data-copy="s10.completeHeading">'+esc(c("s10.completeHeading"))+'</h2></div>'
     + '<div class="body"><p class="muted" data-copy="s10.completeBody">'+esc(c("s10.completeBody"))+'</p></div>'
     + '<div class="foot"><button class="btn secondary" data-goto="8" data-copy="s10.back">'+esc(c("s10.back"))+'</button>'
     + '<button class="btn primary" data-copy="s10.finish">'+esc(c("s10.finish"))+'</button></div></div>'
  + '</div>';
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; render(); return; }
  const at = e.target.closest("[data-authtab]");
  if (at) { state.authTab = at.dataset.authtab; render(); return; }
  const asp = e.target.closest("[data-aspect]");
  if (asp && !asp.dataset.addAspect) { state.editingAspect = +asp.dataset.aspect; render(); return; }
  if (e.target.closest("[data-add-aspect]")) {
    const n = state.aspects.length + 1;
    state.aspects.push({ key:"s10.a"+n, q:"A new question both seats answer.", origin:"s6.added" });
    copy["s10.a"+n] = "New Aspect";
    state.editingAspect = n - 1; persist(); render();
    toast("Aspect added — edit it on the right"); return;
  }
  if (e.target.closest("[data-save-aspect]")) {
    const name = document.getElementById("aspectName"), q = document.getElementById("aspectQuestion");
    if (name && q) {
      const a = state.aspects[state.editingAspect];
      copy[a.key] = name.value.trim() || c(a.key);
      a.q = q.value.trim() || a.q;
      a.origin = "s6.edited"; persist(); render(); toast("Aspect saved — it is yours from creation");
    }
    return;
  }
  const t = e.target.closest("[data-goto],[data-tpl],[data-mode],[data-setting],[data-pay],[data-method],#editToggle,#saveJson,#loadJsonBtn,#resetCopy");
  if (!t) return;
  if (t.dataset.goto !== undefined) { state.stage = +t.dataset.goto; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.tpl) { state.template = t.dataset.tpl; render(); return; }
  if (t.dataset.mode) { state.mode = t.dataset.mode; render(); return; }
  if (t.dataset.setting) { state.setting = t.dataset.setting; render(); return; }
  if (t.dataset.pay) { state.pay = t.dataset.pay; render(); return; }
  if (t.dataset.method) { state.method = t.dataset.method; render(); return; }
  if (t.id === "editToggle") { toggleEdit(); return; }
  if (t.id === "saveJson") { saveJson(); return; }
  if (t.id === "loadJsonBtn") { document.getElementById("loadJson").click(); return; }
  if (t.id === "resetCopy") { copy = Object.assign({},DEFAULT_COPY); persist(); render(); toast("Copy reset to the shipped JSON"); return; }
});
document.addEventListener("keydown", e => {
  if ((e.key==="Enter"||e.key===" ") && e.target.matches('[role="radio"]')) { e.preventDefault(); e.target.click(); }
});
function toggleEdit(){
  const on = document.body.dataset.editing !== "on";
  document.body.dataset.editing = on ? "on" : "off";
  document.querySelectorAll("[data-copy]").forEach(el=>{ el.contentEditable = on?"true":"false"; if(on) el.setAttribute("spellcheck","false"); });
  document.getElementById("editorState").textContent = on ? "Editing — blur writes back to JSON" : "Copy loads from JSON";
  if (on) toast("Click any label to edit it; blur writes it into the JSON");
}
document.addEventListener("blur", e => {
  const el = e.target;
  if (document.body.dataset.editing !== "on" || !el.dataset || !el.dataset.copy) return;
  const next = el.textContent.trim();
  if (!next) { el.textContent = c(el.dataset.copy); return; }
  copy[el.dataset.copy] = next; persist(); toast("Saved “"+el.dataset.copy+"”");
}, true);
function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(copy)); }catch(e){} }
function saveJson(){
  const blob = new Blob([JSON.stringify(copy,null,2)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "alignsynch-copy.json"; a.click();
  URL.revokeObjectURL(a.href); toast("Saved alignsynch-copy.json — "+Object.keys(copy).length+" strings");
}
document.getElementById("loadJson").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => { try { const p = JSON.parse(fr.result); copy = Object.assign({},DEFAULT_COPY,p); persist(); render(); toast("Loaded "+Object.keys(p).length+" strings"); } catch(e){ toast("That file is not valid JSON"); } };
  fr.readAsText(f);
});
let toastTimer;
function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2400); }
render();
</script>
</body>
</html>
