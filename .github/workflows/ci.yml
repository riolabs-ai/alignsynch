name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests a `gh-readonly-queue/...` ref and reports the required
  # check against merge_group, which is a separate event from push/pull_request.
  # Without this trigger the queue waits on `typecheck / lint / build` forever.
  merge_group:

concurrency:
  # merge_group refs are distinct per queue entry, so groups never cross-cancel.
  group: ci-${{ github.ref }}
  # Never cancel a merge_group run: the queue reads a cancelled check as a failure
  # and drops the PR. push and pull_request keep the previous cancel-on-supersede.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  verify:
    # Name + matrix, and why both are the way they are (#171).
    #
    # The repo ships two brands and used to compile one. The gate now runs once per brand, as
    # a matrix dimension on this job rather than as a second job, because the two lanes are one
    # definition with one variable: every step below is the same, and `BRAND` is the only thing
    # that differs — exactly like the lanes inside `verify.sh`.
    #
    # GitHub appends the matrix values to a leg's check-run name, so the two legs report as
    # `typecheck / lint / build (quizhub)` and `… (alignsynch)`. The branch ruleset requires the
    # context `typecheck / lint / build` (ruleset 26115314, integration 15368), and a required
    # context that never reports blocks every merge forever — so `gate`, below, collects both
    # legs under that exact name. That job is the load-bearing name; this one is the work.
    name: typecheck / lint / build (${{ matrix.brand }})
    strategy:
      # Both lanes report even when one fails: "QuizHub is unchanged" is only meaningful next to
      # the other brand's result.
      fail-fast: false
      matrix:
        brand: [quizhub, alignsynch]
    # pinned OS: ubuntu-latest is migrating to Ubuntu 26 during 2026
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # `data/brand.ts` reads this at import and `next.config.mjs` inlines it into the browser
      # bundle, so it is the brand this whole lane builds and tests. `pnpm parity` re-sets it per
      # process — it checks both brands in both lanes, which is redundant and deliberate: the
      # gate script is identical in every lane.
      BRAND: ${{ matrix.brand }}
    steps:
      # The lane classifier (scripts/gate-lanes.sh) diffs `$GATE_REF...HEAD` —
      # default `origin/main`, three-dot, so it needs the ref AND a real merge
      # base with it. actions/checkout's default depth-1, single-branch clone has
      # neither: `origin/main` simply did not exist in the CI clone, so
      # `GATE_LANE=auto` resolved to `lane=code (… no origin/main to diff
      # against — full gate (conservative))` on every single run and the lane
      # mechanism was dead in the only place it is enforced. Full history is
      # ~12 MB here (198 commits), which is what makes the ref resolvable.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only diagnostics + a belt-and-braces ref. A failed fetch must NOT fail
      # the job: a missing base ref is a reason to run the FULL gate, never a
      # reason to skip steps or to stop the run (see the fallback in
      # scripts/gate-lanes.sh::resolve_lane).
      - name: Fetch the gate's diff base (origin/main)
        run: |
          if git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main; then
            echo "GATE_REF=origin/main -> $(git rev-parse --short origin/main)"
          else
            echo "::warning title=Lane classifier::origin/main is not in this clone — verify.sh falls back to lane=code (full gate)"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # keep in sync with EXPECTED_PNPM in scripts/verify.sh
          version: 12.16.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Issue #138: `docs/glossary.md` is generated from the schema comments, so a comment
      # edited without regenerating the page is drift CI can see and no local typecheck can.
      # This step *regenerates* the page and fails on any byte that differs — the issue's
      # requested step, in the existing workflow.
      #
      # It is not CI-only, which is the rule the next comment guards: `bash scripts/verify.sh`
      # runs the same generator in every lane (`pnpm glossary:check` — the read-only form of
      # the diff below), so a developer cannot be handed a green local gate for a page CI
      # rejects. It sits *before* the gate so a stale page fails under its own step name
      # instead of disappearing inside the verify step's output.
      - name: glossary (docs/glossary.md regenerates to itself)
        run: |
          node scripts/gen-glossary.mjs
          if [ -n "$(git status --porcelain -- docs/glossary.md)" ]; then
            git --no-pager diff -- docs/glossary.md
            echo "::error title=glossary::docs/glossary.md is stale — the schema comments changed. Run \"pnpm glossary\" and commit the page."
            exit 1
          fi

      # The gate. Nothing above or below this line may run a check: CI runs what
      # `bash scripts/verify.sh` runs, in the same order, on the same pinned
      # runtime. A check that exists only in this file is a red push; a check that
      # exists only in the script is a red CI run. One definition, two callers.
      #
      # GATE_LANE=auto is the lane classifier (docs/REPO-LAYERS.md). It only
      # classifies because the checkout above carries origin/main; the fallback
      # is unchanged and deliberately conservative — no ref, no diff, or a
      # non-fast-forward base means lane=code and the full gate.
      - name: verify (bash scripts/verify.sh)
        env:
          GATE_LANE: auto
        run: bash scripts/verify.sh

      # The diagnostic half of brand parity (#171). `pnpm parity` never commits HTML — the
      # committed fixtures are a hash manifest and a structural summary — so when a route's hash
      # moves, the full render is written to a gitignored directory and this is what makes it
      # readable from the failed run. `if: failure()` so a green leg uploads nothing, and
      # `if-no-files-found: ignore` because most failures are not parity failures.
      - name: parity artifacts (full HTML of any route that drifted)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-artifacts-${{ matrix.brand }}
          path: tests/parity/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    # The required status check, and the only job whose name it must be.
    #
    # The ruleset on `main` requires the context `typecheck / lint / build`. A matrix leg cannot
    # report that name — GitHub suffixes it with the matrix values — so without this job every
    # PR would wait forever on a check nobody sends, which is the failure mode that makes a
    # required context worse than no gate at all. `needs` + `always()` is what makes it report
    # on every outcome: a leg that failed, a leg that was cancelled, both failed.
    #
    # It runs no checks of its own. Adding one here would be a second definition of the gate.
    name: typecheck / lint / build
    needs: [verify]
    if: always()
    # pinned OS: ubuntu-latest is migrating to Ubuntu 26 during 2026
    runs-on: ubuntu-24.04
    steps:
      - name: Both brand lanes are green
        env:
          # The aggregate of the matrix: `success` only when every leg succeeded.
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "verify (both brands): $VERIFY"
          if [ "$VERIFY" != "success" ]; then
            echo "::error title=typecheck / lint / build::a brand lane did not pass ($VERIFY) — fix the failing lane; this check stays red until both brands are green"
            exit 1
          fi
