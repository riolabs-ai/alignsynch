name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests a `gh-readonly-queue/...` ref and reports the required
  # check against merge_group, which is a separate event from push/pull_request.
  # Without this trigger the queue waits on `typecheck / lint / build` forever.
  merge_group:

concurrency:
  # merge_group refs are distinct per queue entry, so groups never cross-cancel.
  group: ci-${{ github.ref }}
  # Never cancel a merge_group run: the queue reads a cancelled check as a failure
  # and drops the PR. push and pull_request keep the previous cancel-on-supersede.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: typecheck / lint / build
    # pinned OS: ubuntu-latest is migrating to Ubuntu 26 during 2026
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (next typegen && tsc --noEmit)
        run: pnpm typecheck

      - name: Validate content data (data:check)
        run: pnpm data:check

      - name: Lint (biome check)
        run: pnpm lint

      - name: Format check (biome format)
        run: pnpm format:check

      - name: Build (next build)
        run: pnpm build
