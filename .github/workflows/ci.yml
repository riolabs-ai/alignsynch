name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # The job name is load-bearing: required status checks match on it, so keep
    # it stable even as the step list changes (the steps live in the script now).
    name: typecheck / lint / build
    # pinned OS: ubuntu-latest is migrating to Ubuntu 26 during 2026
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # keep in sync with EXPECTED_PNPM in scripts/verify.sh
          version: 12.16.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The gate. Nothing above or below this line may run a check: CI runs what
      # `bash scripts/verify.sh` runs, in the same order, on the same pinned
      # runtime. A check that exists only in this file is a red push; a check that
      # exists only in the script is a red CI run. One definition, two callers.
      - name: verify (bash scripts/verify.sh)
        run: bash scripts/verify.sh
